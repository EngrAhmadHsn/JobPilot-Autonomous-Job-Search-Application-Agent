[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-job-applier"
version = "0.1.0"
description = "Autonomous AI Job Application Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "chromadb>=1.0",
    "fastembed>=0.9.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "playwright>=1.51.0",
    "pydantic>=2.13.5",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "ruff>=0.16.7",
    "sqlalchemy>=2.0.52",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # chromadb 1.5.9 routes custom embedding functions through a config path it
    # itself marks deprecated. Our EF never relies on config-based
    # reconstruction: the store always passes explicit embeddings.
    "ignore:legacy embedding function config:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
