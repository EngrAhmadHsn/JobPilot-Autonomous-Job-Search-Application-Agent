[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-job-applier"
version = "0.1.0"
description = "Autonomous AI Job Application Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "chromadb>=1.0",
    "fastembed>=0.9.0",
    "fastapi>=0.141.1",
    # WS-14 · A1: the identity stack. `fastapi-users` is the established
    # FastAPI identity library — the account lifecycle, the password
    # hashing and the session handling are its job, not a hand-rolled
    # token scheme. The database adapters are ours (the library's are
    # async-only and this codebase is synchronous end to end), so the
    # `sqlalchemy` extra is not needed.
    "fastapi-users>=15.0.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "playwright>=1.51.0",
    "pydantic>=2.13.5",
    # WS-14 · A1: the memory-hard password KDF, reached through
    # `fastapi_users.password.PasswordHelper`. The `argon2` extra pulls
    # the argon2-cffi binding.
    "pwdlib[argon2]>=0.3.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "ruff>=0.16.7",
    "sqlalchemy>=2.0.52",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "uvicorn>=0.35.0",
]

# The development and CI toolchain. It is an extra rather than a
# separate requirements file so that ``pip install -e ".[dev]"`` is the
# one command the CI workflow (and a new contributor) needs.
[project.optional-dependencies]
dev = [
    "pip-audit>=2.9.0",
    # The CI-gate test parses the workflow file.
    "pyyaml>=6.0.2",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # The tests that drive a real Chromium. They are slow, and they need
    # a browser binary that the runner may not have, so CI runs them in
    # their own job with the browser installed. The marker is a
    # wall-clock optimisation, never a correctness requirement: both CI
    # jobs install Chromium, so an unmarked browser test still passes.
    "browser: needs a real Chromium (Playwright)",
]
filterwarnings = [
    # chromadb 1.5.9 routes custom embedding functions through a config path it
    # itself marks deprecated. Our EF never relies on config-based
    # reconstruction: the store always passes explicit embeddings.
    "ignore:legacy embedding function config:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
