[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-job-applier"
version = "0.1.0"
description = "Autonomous AI Job Application Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "playwright>=1.51.0",
    "pydantic>=2.13.5",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.16.7",
    "sqlalchemy>=2.0.52",
    "pytest>=8.4.0",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
