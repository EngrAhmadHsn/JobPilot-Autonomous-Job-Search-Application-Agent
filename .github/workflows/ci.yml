name: CI

# WS-14 · Phase E: "an isolation control that is not in CI is a control
# that decays."
#
# The suite runs the whole gate on every push and pull request:
#
#   - the linter (ruff), because a rule that is not enforced is a
#     comment;
#   - the test suite, including the two-user isolation matrix — the
#     suite that matters most;
#   - the migration check, because a migration that does not apply (or
#     does not reverse) breaks a deployment, and the check has to run
#     somewhere other than on the developer's machine;
#   - the dependency audit, because a known-vulnerable dependency in a
#     project that handles resumes and employer applications is not a
#     theoretical finding.
#
# **The browser tests and the Chromium install.** The tests that drive a
# real browser are marked `browser` (see `pyproject.toml`), and they run
# in a separate job so that the fast gate — the linter, the isolation
# matrix, the migration check, the audit — does not wait for a browser.
#
# Both jobs install Chromium. The gate job does not *need* it, because it
# excludes the browser-marked tests, but it installs it anyway: the
# failure mode this guards against is a browser test that somebody adds
# without marking it, which would otherwise fail the gate with an
# unreadable "Executable doesn't exist" error instead of passing. With
# Chromium installed in both jobs, an unmarked browser test still runs
# and still passes — the marker is a wall-clock optimisation, never a
# correctness requirement.
#
# The earlier version of this workflow ran the **whole** suite in the
# gate job, which did not install Chromium, and named three files in the
# browser job. That is what failed: sixteen browser tests died on a
# runner with no browser binary.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  gate:
    name: Lint, test, migrate, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium
        # Insurance, not a requirement: the browser-marked tests run in
        # the other job. This is here so that a browser test somebody
        # adds without marking it still passes here rather than dying
        # with "Executable doesn't exist".
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # The browser-marked tests run in the browser job. Everything
        # else — the unit suite and the two-user isolation matrix — runs
        # here, where it is fast and needs no browser.
        run: pytest tests -q -m "not browser" -n auto --dist loadfile

      - name: The migration check
        run: python scripts/verify_migrations.py

      - name: Audit the dependencies
        # The script applies the documented exception list in
        # security/dependency-audit-ignores.txt. Anything that is not on
        # that list fails the build.
        run: python scripts/audit_dependencies.py

  browser:
    name: The browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: The browser tests
        # Every test marked `browser`, selected by the marker rather
        # than by a hand-written list of files: a list goes stale, and a
        # stale list is a test that quietly stops running.
        run: pytest tests -q -m browser
